name: Bug report
description: Help Crumb get back to lunch.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and what you actually saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, browser, device and district
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or short clip
      description: Optional. Remove personal data or credentials first.
